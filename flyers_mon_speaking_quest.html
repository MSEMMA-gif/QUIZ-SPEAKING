    // =========================================================================
    // 3. WEB AUDIO SYNTHESIZER (GAME SFX)
    // =========================================================================
    const playGameSFX = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const playTone = (freq, startOffset, duration, wave = "sine", vol = 0.14) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now + startOffset);
          gain.gain.setValueAtTime(vol, now + startOffset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + startOffset);
          osc.stop(now + startOffset + duration);
        };

        if (type === "tap") {
          playTone(620, 0, 0.07, "sine", 0.12);
        } else if (type === "flip") {
          playTone(380, 0, 0.08, "triangle", 0.12);
          playTone(580, 0.05, 0.1, "triangle", 0.12);
        } else if (type === "success") {
          playTone(523.25, 0, 0.12, "triangle", 0.16);
          playTone(659.25, 0.09, 0.12, "triangle", 0.16);
          playTone(783.99, 0.18, 0.24, "triangle", 0.18);
        } else if (type === "catch") {
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
            playTone(f, i * 0.09, 0.32, "triangle", 0.18);
          });
        } else if (type === "error") {
          playTone(240, 0, 0.16, "sawtooth", 0.1);
          playTone(190, 0.12, 0.22, "sawtooth", 0.1);
        }
      } catch (err) {
        // Ignore audio errors on restricted devices
      }
    };

    // =========================================================================
    // 4. INTONATION & WORD-BY-WORD GRADING ENGINE
    // =========================================================================
    const STOP_WORDS = new Set(["i", "a", "an", "the", "is", "are", "am", "to", "in", "on", "at", "by", "with", "and", "my", "her", "his", "it", "it's", "she", "he", "we", "they", "there"]);

    // Builds stressed words + intonation arrows (↗ ↘) for Flashcard back
    function buildIntonationTokens(sentence) {
      const rawTokens = sentence.split(/\s+/).filter(Boolean);
      return rawTokens.map((tok, idx) => {
        const clean = tok.toLowerCase().replace(/[^a-z0-9']/g, "");
        const hasComma = tok.includes(",");
        const hasPeriod = tok.includes(".") || tok.includes("!");
        const isLast = idx === rawTokens.length - 1;
        const isStressed = clean.length > 0 && !STOP_WORDS.has(clean);

        let arrow = "";
        if (hasComma) arrow = "↗";
        else if (hasPeriod || isLast) arrow = "↘";

        return { text: tok, isStressed, arrow };
      });
    }

    // Normalizes text & compares spoken answer against model answer word-by-word

    function evaluateSpeakingWordByWord(modelAnswer, userTranscript) {
      const cleanStr = (s) =>
        s
          .toLowerCase()
          .replace(/[.,!?;:"]/g, " ")
          .replace(/’/g, "'")
          .split(/\s+/)
          .filter(Boolean);

      const userWords = cleanStr(userTranscript);
      const userSet = new Set(userWords);

      const modelRawTokens = modelAnswer.split(/\s+/).filter(Boolean);
      let matchedCount = 0;
      const missingWords = [];

      const wordResults = modelRawTokens.map((rawWord) => {
        const norm = rawWord.toLowerCase().replace(/[.,!?;:"]/g, "").replace(/’/g, "'");
        let isMatch = userSet.has(norm);

        if (!isMatch && SYNONYM_EQUIVALENTS[norm]) {
          isMatch = SYNONYM_EQUIVALENTS[norm].some((alt) => userSet.has(alt));
        }
        // Check alphanumeric strip
        if (!isMatch) {
          const alphaOnly = norm.replace(/[^a-z0-9]/g, "");
          isMatch = userWords.some((uw) => uw.replace(/[^a-z0-9]/g, "") === alphaOnly);
        }

        if (isMatch) {
          matchedCount++;
        } else {
          missingWords.push(rawWord.replace(/[.,!?]/g, ""));
        }

        return {
          word: rawWord,
          matched: isMatch
        };
      });

      const accuracy = modelRawTokens.length > 0
        ? Math.round((matchedCount / modelRawTokens.length) * 100)
        : 0;

      let stars = 1;
      if (accuracy >= 90) stars = 5;
      else if (accuracy >= 75) stars = 4;
      else if (accuracy >= 55) stars = 3;
      else if (accuracy >= 30) stars = 2;

      let feedbackVi = "";
      if (userWords.length === 0) {
        feedbackVi = "Chưa ghi nhận được giọng nói. Em hãy bấm Mic nói to rõ hoặc nhập chữ vào khung dự phòng nhé!";
      } else if (accuracy >= 85) {
        feedbackVi = `Tuyệt vời (${accuracy}%)! Em phát âm chuẩn xác các từ khóa Cambridge Flyers.`;
      } else if (accuracy >= 55) {
        feedbackVi = `Khá tốt (${accuracy}%), nhưng em còn thiếu/sai từ: "${missingWords.slice(0, 4).join(", ")}". Hãy nghe mẫu và nói lại nhé!`;
      } else {
        feedbackVi = `Cần luyện thêm (${accuracy}%). Em bị thiếu nhiều từ khóa: "${missingWords.slice(0, 5).join(", ")}". Hãy bấm nghe mẫu và đọc nhại (Shadowing)!`;
      }

      return {
        accuracy,
        stars,
        wordResults,
        missingWords,
        feedbackVi,
        passed: accuracy >= 70
      };
    }

    // =========================================================================

      // --- Step 1: 3D Flashcard State ---
      const [isFlipped, setIsFlipped] = useState(false);

      // --- Step 2: Sentence Builder State ---
      const [builderPool, setBuilderPool] = useState([]);
      const [builderChosen, setBuilderChosen] = useState([]);
      const [builderStatus, setBuilderStatus] = useState("playing"); // 'playing' | 'correct' | 'wrong'

      // --- Step 3: Speaking Arena State ---
      const [isRecording, setIsRecording] = useState(false);
      const [spokenInput, setSpokenInput] = useState("");
      const [arenaResult, setArenaResult] = useState(null);
      const [shadowingCompleted, setShadowingCompleted] = useState(false);

      // --- Boss 15-Shield Mode State ---
      const [bossQuestions, setBossQuestions] = useState([]);

      const [bossScoreShields, setBossScoreShields] = useState(0);

      // --- UI Notifications & Modals ---
      const [toast, setToast] = useState(null);
      const [catchPopup, setCatchPopup] = useState(null); // { monster, isMega, isEvolution }
      const [syncStatus, setSyncStatus] = useState("idle"); // 'idle' | 'syncing' | 'synced'

      const recognitionRef = useRef(null);
      const prevCaughtRef = useRef({});

      // Helper: Show non-blocking Toast
      const triggerToast = (msg, type = "info") => {
        setToast({ msg, type, id: Date.now() });
      };

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 3200);
        return () => clearTimeout(t);
      }, [toast]);

      // Save progress to localStorage
      useEffect(() => {
        localStorage.setItem("fm_name", studentName);
        localStorage.setItem("fm_class", studentClass);
        localStorage.setItem("fm_sheet_url", sheetUrl);
        localStorage.setItem("fm_xp", String(xp));

        localStorage.setItem("fm_q_progress", JSON.stringify(qProgress));
      }, [studentName, studentClass, sheetUrl, xp, streak, bestStreak, qProgress]);

      // Active Topic Object
      const activeTopic = useMemo(
        () => FLYERS_TOPICS.find((t) => t.id === selectedTopicId) || FLYERS_TOPICS[0],
        [selectedTopicId]
      );

      // Current Question (either Topic mode or Boss mode)
      const currentQuestion = useMemo(() => {
        if (mainTab === "boss" && bossQuestions.length > 0) {
          return bossQuestions[bossIdx] || bossQuestions[0];
        }
        return activeTopic.questions[qIndex] || activeTopic.questions[0];
      }, [mainTab, bossQuestions, bossIdx, activeTopic, qIndex]);

      // Compute Topic Mastery, Caught Monsters, Mega Evolutions, and 15 Cambridge Shields
      const stats = useMemo(() => {
        let memorizedCount = 0;
        let totalArenaStars = 0;
        let arenaQuestionsAttempted = 0;

        Object.values(qProgress).forEach((entry) => {
          if (entry.flashcardDone || entry.builderDone || (entry.arenaStars && entry.arenaStars >= 4)) {
            memorizedCount++;
          }
          if (entry.arenaStars && entry.arenaStars > 0) {
            totalArenaStars += entry.arenaStars;
            arenaQuestionsAttempted++;
          }
        });

        const topicStatuses = FLYERS_TOPICS.map((t) => {
          const total = t.questions.length;
          let doneCount = 0;
          let arenaPassedCount = 0;
          t.questions.forEach((q) => {
            const p = qProgress[q.id];
            if (p && (p.flashcardDone || p.builderDone || (p.arenaStars && p.arenaStars >= 3))) {
              doneCount++;
            }
            if (p && p.arenaStars && p.arenaStars >= 4) {
              arenaPassedCount++;
            }
          });
          const pct = Math.round((doneCount / total) * 100);
          // Topic monster is caught if student completes at least 50% of topic questions (or >= 4 questions)
          const caught = doneCount >= Math.min(4, total) || pct >= 50;
          // Mega evolution unlocks at >= 80% topic mastery OR bestStreak >= 5
          const isMega = caught && (pct >= 80 || bestStreak >= 5 || arenaPassedCount >= Math.ceil(total * 0.7));
          return {
            topic: t,
            total,
            doneCount,
            pct,
            caught,
            isMega
          };
        });

        const caughtTopicMonsters = topicStatuses.filter((s) => s.caught);

        // Calculate 15 Cambridge Shields (0 to 15)
        // Combines caught monsters + arena stars + boss exam score
        const calculatedShields = Math.min(
          15,
          Math.max(
            bossScoreShields,
            Math.floor(caughtTopicMonsters.length * 0.75 + totalArenaStars / 18)
          )
        );

        const bossCaught = calculatedShields >= 15;
        const bossMega = bossCaught && (bestStreak >= 8 || memorizedCount >= 120);

        const level = Math.floor(xp / 100) + 1;

        return {
          memorizedCount,
          totalArenaStars,
          arenaQuestionsAttempted,
          topicStatuses,
          caughtCount: caughtTopicMonsters.length + (bossCaught ? 1 : 0),
          shields: calculatedShields,
          bossCaught,
          bossMega,
          level
        };
      }, [qProgress, xp, bestStreak, bossScoreShields]);

      // Detect newly caught Flyers-Mon or Mega Evolution and trigger celebration popup!
      useEffect(() => {
        stats.topicStatuses.forEach((st) => {
          const prev = prevCaughtRef.current[st.topic.id];

                isEvolution: true,

      // =====================================================================
      // 7. SPEECH SYNTHESIS (TTS) & SPEECH RECOGNITION (STT)
      // =====================================================================
      const speakEnglish = (text, rate = 0.92) => {
        if (!("speechSynthesis" in window)) {
          triggerToast("Trình duyệt không hỗ trợ đọc âm thanh.", "error");
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = rate;
        utter.pitch = 1.04;

        // Prefer natural English voices if available
        const voices = window.speechSynthesis.getVoices();
        const preferred =
          voices.find((v) => v.lang.includes("en-US") && (v.name.includes("Google") || v.name.includes("Samantha") || v.name.includes("Natural"))) ||
          voices.find((v) => v.lang.startsWith("en"));
        if (preferred) utter.voice = preferred;

        window.speechSynthesis.speak(utter);
      };

      // Setup SpeechRecognition once
      useEffect(() => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          setMicSupported(false);
          return;
        }
        const recognition = new SpeechRec();
        recognition.lang = "en-US";
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
          let transcript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          setSpokenInput(transcript);
        };

        recognition.onerror = (event) => {
          setIsRecording(false);
          if (event.error === "not-allowed") {
            triggerToast("Micro bị chặn quyền! Em hãy nhập câu trả lời vào ô gõ chữ bên dưới nhé.", "error");
          } else if (event.error !== "aborted") {
            triggerToast("Không nghe rõ giọng nói. Thử bấm Mic lại hoặc gõ chữ nhé!", "error");
          }
        };

        recognition.onend = () => {
          setIsRecording(false);
        };

        recognitionRef.current = recognition;
      }, []);

      const toggleRecording = () => {
        if (!recognitionRef.current) {
          triggerToast("Thiết bị không hỗ trợ ghi âm trực tiếp. Hãy dùng khung nhập chữ bên dưới!", "error");
          return;
        }
        if (isRecording) {
          recognitionRef.current.stop();
          setIsRecording(false);
        } else {
          try {
            setSpokenInput("");
            setArenaResult(null);
            recognitionRef.current.start();
            setIsRecording(true);
            playGameSFX("tap");
          } catch (e) {
            setIsRecording(false);
            triggerToast("Micro đang bận, hãy thử lại sau 1 giây.", "error");
          }
        }
      };

      // =====================================================================
      // 8. STEP 1, STEP 2, STEP 3 & BOSS HANDLERS
      // =====================================================================
      // Reset states whenever question or step changes
      useEffect(() => {
        setIsFlipped(false);
        setSpokenInput("");
        setArenaResult(null);
        setShadowingCompleted(false);
        if (isRecording && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch {}
          setIsRecording(false);
        }

        // Prepare Sentence Builder tokens
        if (currentQuestion) {
          const tokens = currentQuestion.model
            .split(/\s+/)
            .filter(Boolean)
            .map((word, idx) => ({ id: `${currentQuestion.id}_w_${idx}`, word, origIdx: idx }));

          // Shuffle tokens deterministically yet varied
          const shuffled = [...tokens];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          setBuilderPool(shuffled);
          setBuilderChosen([]);
          setBuilderStatus("playing");
        }
      }, [currentQuestion, stepTab]);

      // Step 1: Mark Flashcard Memorized (+5 XP)
      const handleMarkFlashcardDone = () => {
        playGameSFX("success");
        const already = qProgress[currentQuestion.id]?.flashcardDone;
        setQProgress((prev) => ({
          ...prev,
          [currentQuestion.id]: {
            ...(prev[currentQuestion.id] || {}),
            flashcardDone: true
          }
        }));
        if (!already) {
          setXp((prev) => prev + 5);
          triggerToast("✅ Đã thuộc thẻ! +5 XP", "success");
        } else {
          triggerToast("👍 Đã ôn lại thẻ!", "info");
        }

        if (qIndex < activeTopic.questions.length - 1) {
          setQIndex((prev) => prev + 1);
        } else {
          triggerToast("🎉 Hết thẻ chủ đề này! Chuyển sang Bước 2: Ghép Câu nhé!", "success");
          setQIndex(0);
          setStepTab(2);
        }
      };

      // Step 2: Sentence Builder Handlers
      const handlePickWord = (token) => {
        if (builderStatus === "correct") return;
        playGameSFX("tap");
        const nextChosen = [...builderChosen, token];
        const nextPool = builderPool.filter((t) => t.id !== token.id);
        setBuilderChosen(nextChosen);
        setBuilderPool(nextPool);

        // Check if all words placed
        if (nextPool.length === 0) {
          const builtSentence = nextChosen.map((t) => t.word).join(" ");
          if (builtSentence === currentQuestion.model) {
            setBuilderStatus("correct");
            playGameSFX("success");
            speakEnglish(currentQuestion.model, 0.92);

            const already = qProgress[currentQuestion.id]?.builderDone;
            setQProgress((prev) => ({
              ...prev,
              [currentQuestion.id]: {
                ...(prev[currentQuestion.id] || {}),
                builderDone: true
              }
            }));

            const newStreak = streak + 1;
            setStreak(newStreak);
            if (newStreak > bestStreak) setBestStreak(newStreak);

            if (!already) {
              setXp((prev) => prev + 10);
              triggerToast("🎯 Ghép câu chuẩn xác! +10 XP & +1 Streak 🔥", "success");
            } else {
              triggerToast("🎯 Ghép câu chính xác! +1 Streak 🔥", "success");
            }
          } else {
            setBuilderStatus("wrong");
            playGameSFX("error");
            setStreak(0);
            triggerToast("❌ Sai thứ tự ngữ pháp rồi! Chạm vào từ để xếp lại nhé.", "error");
          }
        }
      };

      const handleRemoveChosenWord = (token) => {
        if (builderStatus === "correct") return;
        playGameSFX("tap");
        setBuilderStatus("playing");
        setBuilderChosen((prev) => prev.filter((t) => t.id !== token.id));
        setBuilderPool((prev) => [...prev, token]);
      };

      const handleBuilderHint = () => {
        if (builderStatus === "correct") return;
        const targetWords = currentQuestion.model.split(/\s+/).filter(Boolean);
        // Find first index where chosen differs from target
        let correctPrefixLen = 0;
        while (
          correctPrefixLen < builderChosen.length &&
          builderChosen[correctPrefixLen].word === targetWords[correctPrefixLen]
        ) {
          correctPrefixLen++;
        }

        const validPrefix = builderChosen.slice(0, correctPrefixLen);
        const returnedTokens = builderChosen.slice(correctPrefixLen);
        const currentPool = [...builderPool, ...returnedTokens];

        if (correctPrefixLen >= targetWords.length) return;
        const neededWord = targetWords[correctPrefixLen];
        const hintTokenIdx = currentPool.findIndex((t) => t.word === neededWord);

        if (hintTokenIdx !== -1) {
          const hintToken = currentPool[hintTokenIdx];
          const remainingPool = currentPool.filter((_, idx) => idx !== hintTokenIdx);
          const updatedChosen = [...validPrefix, hintToken];

          playGameSFX("flip");
          setBuilderChosen(updatedChosen);
          setBuilderPool(remainingPool);
          setBuilderStatus("playing");

          if (remainingPool.length === 0) {
            setBuilderStatus("correct");
            playGameSFX("success");
            speakEnglish(currentQuestion.model, 0.92);
            setQProgress((prev) => ({
              ...prev,
              [currentQuestion.id]: {
                ...(prev[currentQuestion.id] || {}),
                builderDone: true
              }
            }));
            setXp((prev) => prev + 5);
            triggerToast("💡 Hoàn thành câu với gợi ý! +5 XP", "success");
          }
        }
      };

      // Step 3 & Boss: Grade Speaking Answer
      const handleGradeArenaAnswer = () => {
        if (isRecording && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch {}
          setIsRecording(false);
        }

        const res = evaluateSpeakingWordByWord(currentQuestion.model, spokenInput);
        setArenaResult(res);

        // Always play model answer after grading so student hears native pronunciation & intonation
        setTimeout(() => {
          speakEnglish(currentQuestion.model, 0.9);
        }, 350);

        if (res.passed) {
          playGameSFX("success");
          const prevStars = qProgress[currentQuestion.id]?.arenaStars || 0;
          const bestStars = Math.max(prevStars, res.stars);

          setQProgress((prev) => ({
            ...prev,
            [currentQuestion.id]: {
              ...(prev[currentQuestion.id] || {}),
              arenaStars: bestStars
            }
          }));

          const earnedXp = res.stars * 5;
          setXp((prev) => prev + earnedXp);
          const nextStreak = streak + 1;
          setStreak(nextStreak);
          if (nextStreak > bestStreak) setBestStreak(nextStreak);

          if (mainTab === "boss") {
            setBossScoreShields((prev) => Math.min(15, prev + 1));
          }
          triggerToast(`⚔️ Đạt ${res.stars}/5 Sao! +${earnedXp} XP & Streak ${nextStreak}🔥`, "success");
        } else {
          playGameSFX("error");
          setStreak(0);
          triggerToast("⚠️ Chưa đạt 70%! Nghe mẫu và bấm 'Nói lại Shadowing' để sửa lỗi nhé.", "error");
        }
      };

      // Shadowing retry bonus after hearing model answer
      const handleShadowingRetry = () => {
        if (!arenaResult) return;
        const res = evaluateSpeakingWordByWord(currentQuestion.model, spokenInput);
        setArenaResult(res);

        if (res.passed && !shadowingCompleted) {
          playGameSFX("catch");
          setShadowingCompleted(true);
          const prevStars = qProgress[currentQuestion.id]?.arenaStars || 0;
          setQProgress((prev) => ({
            ...prev,
            [currentQuestion.id]: {
              ...(prev[currentQuestion.id] || {}),
              arenaStars: Math.max(prevStars, res.stars)
            }
          }));
          setXp((prev) => prev + 15);
          const nextStreak = streak + 1;
          setStreak(nextStreak);
          if (nextStreak > bestStreak) setBestStreak(nextStreak);
          if (mainTab === "boss") {
            setBossScoreShields((prev) => Math.min(15, prev + 1));
          }
          triggerToast("🌟 Shadowing sửa lỗi thành công! +15 XP & Phục hồi Streak!", "success");
        } else {
          speakEnglish(currentQuestion.model, 0.85);
          triggerToast("🔊 Nghe kỹ các từ màu đỏ và thử lại nhé!", "info");
        }
      };

      // Start 15-Shield Boss Gauntlet (15 random questions from all 193 questions)
      const startBossChallenge = () => {
        playGameSFX("catch");
        const allQ = FLYERS_TOPICS.flatMap((t) =>
          t.questions.map((q) => ({ ...q, topicShort: t.shortTitle }))
        );
        const shuffled = [...allQ];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const picked15 = shuffled.slice(0, 15);
        setBossQuestions(picked15);
        setBossIdx(0);
        setBossScoreShields(0);
        setBossFinished(false);
        setMainTab("boss");
        setTimeout(() => {
          speakEnglish(picked15[0].q, 0.92);
        }, 400);
      };

      // =====================================================================
      // 9. GOOGLE SHEETS SYNC & ZALO REPORT CLIPBOARD
      // =====================================================================
      const syncToGoogleSheets = async (activityLabel = "Cập nhật tiến độ") => {
        if (!sheetUrl || !sheetUrl.trim().startsWith("http")) return;
        setSyncStatus("syncing");
        const caughtNames = stats.topicStatuses
          .filter((s) => s.caught)
          .map((s) => (s.isMega ? s.topic.monster.megaName : s.topic.monster.name));
        if (stats.bossCaught) {
          caughtNames.push(stats.bossMega ? BOSS_MONSTER_015.megaName : BOSS_MONSTER_015.name);
        }

        const payload = {
          studentName: studentName || "Học sinh",
          studentClass: studentClass || "Flyers",
          activity: activityLabel,
          xp,
          shields: stats.shields,
          memorizedCount: stats.memorizedCount,
          streak: bestStreak,
          caughtMonsters: caughtNames.join(", ") || "Chưa có"
        };

        try {
          await fetch(sheetUrl.trim(), {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          setSyncStatus("synced");
          setTimeout(() => setSyncStatus("idle"), 3000);
        } catch {
          setSyncStatus("idle");
        }
      };

      const copyTextSafe = (text) => {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
        } catch {
          if (navigator.clipboard) navigator.clipboard.writeText(text);
        }
        document.body.removeChild(textarea);
      };

      const handleCopyZaloReport = () => {
        playGameSFX("success");
        const caughtList = stats.topicStatuses
          .filter((s) => s.caught)
          .map((s) => `${s.topic.monster.dex} ${s.isMega ? s.topic.monster.megaName : s.topic.monster.name}`);
        if (stats.bossCaught) {
          caughtList.push(`#015 ${stats.bossMega ? BOSS_MONSTER_015.megaName : BOSS_MONSTER_015.name}`);
        }

        const report = [
          `🏆 BÁO CÁO FLYERS-MON: SPEAKING QUEST`,
          `👤 Học sinh: ${studentName || "Chưa đặt tên"} | Lớp: ${studentClass || "A2 Flyers"}`,
          `🎖️ Cấp độ: Level ${stats.level} (${xp} XP)`,
          `🛡️ Mục tiêu Cambridge: ${stats.shields}/15 Khiên`,
          `🔥 Chuỗi trả lời đúng cao nhất: ${bestStreak} câu liên tiếp`,
          `📚 Đã thuộc: ${stats.memorizedCount}/${TOTAL_QUESTIONS_COUNT} câu hỏi Part 4`,
          `🐉 Linh thú đã thu phục (${caughtList.length}/15): ${caughtList.length > 0 ? caughtList.join(", ") : "Đang huấn luyện"}`
        ].join("\n");

        copyTextSafe(report);
        syncToGoogleSheets("Xuất báo cáo Zalo");
        triggerToast("📋 Đã copy báo cáo Zalo & đồng bộ dữ liệu!", "success");
      };

      const intonationTokens = useMemo(
        () => (currentQuestion ? buildIntonationTokens(currentQuestion.model) : []),
        [currentQuestion]
      );

      const currentTopicStatus = stats.topicStatuses.find((s) => s.topic.id === activeTopic.id);

      // =====================================================================
      // 10. RENDER UI
      // =========================================================================
      return (
        <div className="max-w-lg mx-auto min-h-screen flex flex-col justify-between pb-24 relative">
          {/* NON-BLOCKING TOAST BANNER */}
          {toast && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md animate-pop">
              <div
                className={`px-4 py-3 rounded-2xl shadow-2xl border text-xs font-bold flex items-center gap-2.5 ${
                  toast.type === "success"
                    ? "bg-emerald-950/95 border-emerald-400 text-emerald-200"
                    : toast.type === "error"
                    ? "bg-rose-950/95 border-rose-400 text-rose-200"
                    : "bg-slate-900/95 border-sky-400 text-sky-200"
                }`}
              >
                <span className="text-base">
                  {toast.type === "success" ? "✨" : toast.type === "error" ? "⚠️" : "💡"}
                </span>
                <span className="leading-snug">{toast.msg}</span>
              </div>
            </div>
          )}

          {/* TOP HUD BAR (TRAINER STATS & 15-SHIELD TRACKER) */}
          <header className="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-indigo-500/30 px-3 py-2.5">
            <div className="flex items-center justify-between gap-2">
              {/* Trainer Profile Button */}
              <button
                onClick={() => setShowProfileModal(true)}
                className="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 border border-slate-700/80 px-2.5 py-1.5 rounded-2xl transition text-left"
              >
                <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-400 to-rose-500 flex items-center justify-center text-slate-950 font-game font-black text-sm shadow">
                  L{stats.level}
                </div>
                <div>
                  <div className="text-xs font-extrabold text-white truncate max-w-[95px]">
                    {studentName || "Trainer"}
                  </div>
                  <div className="text-[10px] font-semibold text-indigo-300 truncate max-w-[95px]">
                    {studentClass || "A2 Flyers"} • ⚙️
                  </div>
                </div>
              </button>

              {/* Game Counters: Streak, XP, 15 Shields */}
              <div className="flex items-center gap-1.5 font-game text-xs font-extrabold">
                <div className="bg-orange-950/70 border border-orange-500/40 text-orange-300 px-2 py-1.5 rounded-xl flex items-center gap-1">
                  <span>🔥</span>
                  <span>{streak}</span>
                </div>
                <div className="bg-amber-950/70 border border-amber-500/40 text-amber-300 px-2 py-1.5 rounded-xl flex items-center gap-1">
                  <span>⭐</span>
                  <span>{xp}</span>
                </div>
                <div className="bg-sky-950/80 border border-sky-400/50 text-sky-300 px-2.5 py-1.5 rounded-xl flex items-center gap-1 shadow-sm shadow-sky-500/20">
                  <span>🛡️</span>
                  <span>{stats.shields}/15</span>
                </div>
              </div>
            </div>

            {/* 15-Shield Progress Bar */}
            <div className="mt-2 flex items-center gap-2">
              <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700/60">
                <div
                  className="h-full bg-gradient-to-r from-sky-400 via-indigo-400 to-amber-400 transition-all duration-500"
                  style={{ width: `${Math.min(100, (stats.shields / 15) * 100)}%` }}
                />
              </div>
              <span className="text-[10px] font-bold text-slate-400 whitespace-nowrap">
                Thuộc {stats.memorizedCount}/{TOTAL_QUESTIONS_COUNT} câu
              </span>
            </div>
          </header>

          {/* MAIN CONTENT BODY */}
          <main className="flex-1 px-3.5 pt-3 space-y-4">
            {/* ===============================================================
                TAB 1: 14 TOPICS & 3-STEP TRAINING ARENA
               =============================================================== */}
            {mainTab === "topics" && (
              <>
                {/* Horizontal Topic Selector Pills */}
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between px-1">
                    <span className="text-[11px] font-extrabold uppercase tracking-wider text-indigo-300">
                      Chọn Chủ Đề Luyện Tập (14 Chủ Đề)
                    </span>
                    <button
                      onClick={handleCopyZaloReport}
                      className="text-[11px] font-bold text-emerald-400 hover:text-emerald-300 flex items-center gap-1"
                    >
                      <i className="fa-solid fa-share-nodes"></i> Gửi Zalo
                    </button>
                  </div>

                  <div className="flex gap-2 overflow-x-auto pb-1.5 no-scrollbar">
                    {stats.topicStatuses.map((st) => {
                      const active = st.topic.id === activeTopic.id;
                      return (
                        <button
                          key={st.topic.id}
                          onClick={() => {
                            playGameSFX("tap");
                            setSelectedTopicId(st.topic.id);
                            setQIndex(0);
                          }}
                          className={`shrink-0 px-3 py-2 rounded-2xl border text-left transition flex items-center gap-2 ${
                            active
                              ? "bg-indigo-600 border-indigo-300 text-white shadow-lg shadow-indigo-600/30"
                              : "bg-slate-900/90 border-slate-800 text-slate-300 hover:border-slate-600"
                          }`}
                        >
                          <span className="text-base">{st.topic.icon}</span>
                          <div>
                            <div className="text-[11px] font-extrabold leading-tight">
                              {st.topic.number}. {st.topic.shortTitle}
                            </div>
                            <div className="text-[10px] opacity-80 flex items-center gap-1">
                              <span>{st.doneCount}/{st.total}</span>
                              {st.caught && <span className="text-amber-300">• {st.isMega ? "🌟MEGA" : "🔴Đã bắt"}</span>}
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Active Topic Monster Banner */}
                <div className={`bg-gradient-to-r ${activeTopic.color} rounded-3xl p-3.5 shadow-xl border border-white/20 flex items-center justify-between`}>
                  <div className="space-y-1 flex-1 pr-2">
                    <div className="inline-flex items-center gap-1.5 bg-black/25 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold text-white">
                      <span>{activeTopic.monster.dex}</span>
                      <span>•</span>
                      <span>{currentTopicStatus?.isMega ? activeTopic.monster.megaName : activeTopic.monster.name}</span>
                    </div>
                    <h1 className="font-game font-black text-lg text-white leading-tight">
                      {activeTopic.title}
                    </h1>
                    <p className="text-[11px] text-white/90">
                      {currentTopicStatus?.caught
                        ? currentTopicStatus?.isMega
                          ? "✨ Đã tiến hóa dạng MEGA tối thượng!"
                          : "🎉 Đã thu phục! Đạt ≥80% hoặc Streak 5🔥 để tiến hóa Mega!"
                        : `Thuộc ${Math.min(4, activeTopic.questions.length)} câu để thu phục ${activeTopic.monster.name}!`}
                    </p>
                  </div>
                  <div className="shrink-0 bg-slate-950/30 rounded-2xl p-1 border border-white/15">
                    <MonsterSprite
                      monster={activeTopic.monster}
                      isMega={currentTopicStatus?.isMega}
                      locked={!currentTopicStatus?.caught}
                      size={74}
                    />
                  </div>
                </div>

                {/* 3-STEP WORKFLOW TABS */}
                <div className="grid grid-cols-3 gap-1.5 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800">
                  <button
                    onClick={() => { playGameSFX("tap"); setStepTab(1); }}
                    className={`py-2.5 px-2 rounded-xl text-xs font-extrabold transition flex flex-col items-center gap-0.5 ${
                      stepTab === 1
                        ? "bg-sky-500 text-slate-950 shadow-md"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    <span>1️⃣ Thẻ 3D</span>
                    <span className="text-[9px] font-semibold opacity-85">Học & Ngữ điệu</span>
                  </button>

                  <button
                    onClick={() => { playGameSFX("tap"); setStepTab(2); }}
                    className={`py-2.5 px-2 rounded-xl text-xs font-extrabold transition flex flex-col items-center gap-0.5 ${
                      stepTab === 2
                        ? "bg-amber-400 text-slate-950 shadow-md"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    <span>2️⃣ Ghép Câu</span>
                    <span className="text-[9px] font-semibold opacity-85">Phản xạ từ</span>
                  </button>

                  <button
                    onClick={() => { playGameSFX("tap"); setStepTab(3); }}
                    className={`py-2.5 px-2 rounded-xl text-xs font-extrabold transition flex flex-col items-center gap-0.5 ${
                      stepTab === 3
                        ? "bg-rose-500 text-white shadow-md"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    <span>3️⃣ Đấu Trường</span>
                    <span className="text-[9px] font-semibold opacity-85">Nói & Chấm lỗi</span>
                  </button>
                </div>

                {/* Question Navigator Bar */}
                <div className="flex items-center justify-between bg-slate-900/80 px-3 py-2 rounded-2xl border border-slate-800">
                  <button
                    onClick={() => {
                      playGameSFX("tap");

            >
              <i className="fa-solid fa-shield-halved text-base"></i>
              <span className="text-[11px]">Boss 15 Khiên</span>
            </button>

            <button
              onClick={() => { playGameSFX("tap"); setMainTab("dex"); }}
              className={`flex flex-col items-center gap-0.5 py-1 px-4 rounded-xl transition relative ${
                mainTab === "dex" ? "text-rose-400 font-extrabold" : "text-slate-400 font-semibold"
              }`}
            >
              <i className="fa-solid fa-dragon text-base"></i>
              <span className="text-[11px]">Flyers-Dex ({stats.caughtCount}/15)</span>
            </button>
          </nav>

          {/* =================================================================
              MODAL 1: POKÉMON-STYLE MONSTER CATCH & MEGA EVOLUTION POPUP
             ================================================================= */}
          {catchPopup && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-gradient-to-b from-indigo-900 via-slate-900 to-slate-950 border-2 border-amber-400 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl animate-pop">
                <div className="inline-block bg-amber-400 text-slate-950 font-game font-black text-xs px-3.5 py-1 rounded-full uppercase">
                  {catchPopup.isEvolution ? "🌟 TIẾN HÓA MEGA THÀNH CÔNG!" : "🎉 THU PHỤC LINH THÚ MỚI!"}
                </div>

                <div className="py-2">
                  <MonsterSprite monster={catchPopup.monster} isMega={catchPopup.isMega} size={120} />
                </div>

                <div>
                  <div className="text-xs font-bold text-indigo-300">
                    {catchPopup.monster.dex} • {catchPopup.monster.element}
                  </div>
                  <h3 className="font-game font-black text-2xl text-white mt-0.5">
                    {catchPopup.isMega ? catchPopup.monster.megaName : catchPopup.monster.name}
                  </h3>
                  <p className="text-xs text-slate-300 mt-1">{catchPopup.monster.desc}</p>
                </div>

                <button
                  onClick={() => setCatchPopup(null)}
                  className="w-full py-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-game font-black text-sm shadow-lg"
                >
                  Đưa Vào Flyers-Dex ➔
                </button>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 2: STUDENT LOGIN & GOOGLE SHEETS TEACHER TRACKING
             ================================================================= */}
          {showProfileModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-5 max-w-md w-full space-y-4 shadow-2xl animate-pop my-auto">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🎓</span>
                    <div>
                      <h3 className="font-game font-black text-base text-white">
                        Hồ Sơ Học Sinh & Theo Dõi
                      </h3>
                      <p className="text-[11px] text-slate-400">
                        Nhập tên để lưu điểm, mở khóa linh thú & gửi giáo viên
                      </p>
                    </div>
                  </div>
                  {studentName && (
                    <button
                      onClick={() => setShowProfileModal(false)}
                      className="text-slate-400 hover:text-white p-1"
                    >
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  )}
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">
                      Tên học sinh:
                    </label>
                    <input
                      type="text"
                      value={studentName}
                      onChange={(e) => setStudentName(e.target.value)}
                      placeholder="Ví dụ: Nguyễn Minh Khôi"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-sky-400"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">
                      Lớp / Nhóm học:
                    </label>
                    <input
                      type="text"
                      value={studentClass}
                      onChange={(e) => setStudentClass(e.target.value)}
                      placeholder="Ví dụ: Flyers 5A1"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-sky-400"
                    />
                  </div>

                  <div className="pt-1 border-t border-slate-800">
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-xs font-bold text-indigo-300">
                        Link Google Sheets Apps Script (Dành cho Giáo viên):
                      </label>
                      <button
                        onClick={() => setShowScriptHelp((prev) => !prev)}
                        className="text-[11px] font-bold text-sky-400 underline"
                      >
                        {showScriptHelp ? "Ẩn mã Script" : "Lấy mã Apps Script"}
                      </button>
                    </div>
                    <input
                      type="url"
                      value={sheetUrl}
                      onChange={(e) => setSheetUrl(e.target.value)}
                      placeholder="https://script.google.com/macros/s/.../exec"
                      className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-sky-300 focus:outline-none focus:border-indigo-400"
                    />
                  </div>

                  {showScriptHelp && (
                    <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-2">
                      <p className="text-[11px] text-slate-300 leading-relaxed">
                        1. Mở Google Sheets ➔ <strong>Tiện ích mở rộng</strong> ➔ <strong>Apps Script</strong>.<br />
                        2. Dán đoạn mã dưới đây ➔ <strong>Triển khai (Deploy)</strong> ➔ <strong>Ứng dụng web (Web app)</strong> ➔ Quyền truy cập: <strong>Bất kỳ ai (Anyone)</strong>.
                      </p>
                      <textarea
                        readOnly
                        value={APPS_SCRIPT_TEMPLATE}
                        rows={5}
                        className="w-full p-2 rounded-xl bg-slate-900 text-[10px] font-mono text-emerald-300 border border-slate-800"
                      />
                      <button
                        onClick={() => {
                          copyTextSafe(APPS_SCRIPT_TEMPLATE);
                          triggerToast("📋 Đã copy mã Google Apps Script!", "success");
                        }}
                        className="w-full py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs"
                      >
                        Copy Mã Apps Script
                      </button>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button
                    onClick={handleCopyZaloReport}
                    className="py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs flex items-center justify-center gap-1.5"
                  >
                    <i className="fa-solid fa-copy"></i> Copy Báo Cáo Zalo
                  </button>
                  <button
                    onClick={() => {
                      if (!studentName.trim()) {
                        setStudentName("Flyer Trainer");
                      }
                      playGameSFX("success");
                      setShowProfileModal(false);
                      syncToGoogleSheets("Đăng nhập bắt đầu học");
                    }}
                    className="py-3 rounded-2xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-game font-black text-xs shadow-lg"
                  >
                    Lưu & Bắt Đầu 🚀
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 11. SPEAKING ARENA SUB-COMPONENT (BLIND SPEAKING + WORD-BY-WORD GRADING)
    // =========================================================================
    function SpeakingArenaPanel({
      question,
      monster,
      isMega,
      isRecording,
      micSupported,
      spokenInput,
      setSpokenInput,
      toggleRecording,
      onGrade,
      onShadowRetry,
      arenaResult,
      shadowingCompleted,
      speakEnglish,
      onNext
    }) {
      return (
        <div className="bg-slate-900/95 border-2 border-rose-500/40 rounded-3xl p-4 space-y-4 shadow-2xl">
          {/* Examiner Question Header (Model Answer Strictly Hidden Before Grading) */}
          <div className="flex items-center justify-between gap-2 bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800">
            <div className="space-y-1">
              <div className="inline-flex items-center gap-1.5 text-[10px] font-extrabold text-rose-400 uppercase">
                <i className="fa-solid fa-eye-slash"></i>
                <span>Đáp án mẫu đang ẩn — Tự trả lời!</span>
              </div>
              <h3 className="font-game font-black text-lg text-white leading-snug">
                "{question.q}"
              </h3>
              <p className="text-xs text-slate-400">🇻🇳 {question.vi}</p>
            </div>

            <button
              onClick={() => speakEnglish(question.q, 0.92)}
              className="w-12 h-12 rounded-2xl bg-sky-500 hover:bg-sky-400 text-slate-950 flex flex-col items-center justify-center shrink-0 shadow-lg"
              title="Giám khảo đọc câu hỏi"
            >
              <i className="fa-solid fa-volume-high text-base"></i>
              <span className="text-[9px] font-black mt-0.5">Hỏi</span>
            </button>
          </div>

          {/* Monster Opponent Visual */}
          <div className="flex items-center justify-between bg-slate-950/50 px-3.5 py-2 rounded-2xl border border-slate-800/80">
            <div className="flex items-center gap-2.5">
              <MonsterSprite monster={monster} isMega={isMega} size={52} />
              <div>
                <div className="text-xs font-extrabold text-white">
                  {isMega ? monster.megaName : monster.name}
                </div>
                <div className="text-[10px] text-slate-400">
                  {arenaResult?.passed
                    ? "✅ Đã vượt qua thử thách câu này!"
                    : "Nói đạt ≥70% từ khóa để chiến thắng!"}
                </div>
              </div>
            </div>
            {arenaResult && (
              <div className="text-right">
                <div className="text-sm font-black text-amber-400">
                  {"⭐".repeat(arenaResult.stars)}
                </div>
                <div className="text-[10px] font-bold text-slate-300">
                  Chính xác {arenaResult.accuracy}%
                </div>
              </div>
            )}
          </div>

          {/* Microphone Button + Fallback Text Input */}
          <div className="space-y-2.5">
            <div className="flex items-center gap-2">
              <button
                onClick={toggleRecording}
                className={`flex-1 py-3.5 px-4 rounded-2xl font-game font-black text-sm flex items-center justify-center gap-2 transition ${
                  isRecording
                    ? "bg-rose-600 text-white mic-recording"
                    : "bg-gradient-to-r from-rose-500 to-pink-600 hover:brightness-110 text-white shadow-lg shadow-rose-600/30"
                }`}
              >
                <i className={`fa-solid ${isRecording ? "fa-stop" : "fa-microphone"}`}></i>
                <span>
                  {isRecording
                    ? "Đang nghe... Bấm để dừng"
                    : micSupported
                    ? "Bấm Ghi Âm Trả Lời 🎙️"
                    : "Mic không khả dụng (Nhập chữ bên dưới)"}
                </span>
              </button>
            </div>

            {/* Fallback / Live Transcript Input */}
            <div>
              <div className="flex items-center justify-between text-[11px] text-slate-400 mb-1 px-1">
                <span>Nội dung em nói (hoặc gõ dự phòng nếu điện thoại chặn mic):</span>
                {spokenInput && (
                  <button
                    onClick={() => setSpokenInput("")}
                    className="text-rose-400 font-bold"
                  >
                    Xóa
                  </button>
                )}
              </div>
              <textarea
                value={spokenInput}
                onChange={(e) => setSpokenInput(e.target.value)}
                rows={2}
                placeholder="Giọng nói của em sẽ hiện tại đây, hoặc em có thể gõ câu trả lời tiếng Anh..."
                className="w-full p-3 rounded-2xl bg-slate-950 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-rose-400 resize-none"
              />
            </div>

            {!arenaResult ? (
              <button
                onClick={onGrade}
                disabled={!spokenInput.trim()}
                className="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-800 disabled:text-slate-500 text-slate-950 font-game font-black text-sm shadow-lg transition"
              >
                ⚔️ Chấm Điểm & Kiểm Tra Lỗi
              </button>
            ) : (
              /* WORD-BY-WORD GRADING RESULT & SHADOWING PANEL */
              <div className="bg-slate-950/90 border border-indigo-400/40 rounded-2xl p-3.5 space-y-3 animate-pop">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-extrabold text-amber-300">
                    🔍 Chấm từng từ (Xanh = Đúng | Đỏ = Thiếu/Sai):
                  </span>
                  <button
                    onClick={() => speakEnglish(question.model, 0.88)}
                    className="px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 font-extrabold text-[11px] flex items-center gap-1"
                  >
                    <i className="fa-solid fa-volume-high"></i> Nghe mẫu
                  </button>
                </div>

                {/* Word-by-word highlight chips */}
                <div className="flex flex-wrap gap-1.5 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                  {arenaResult.wordResults.map((wr, idx) => (
                    <span
                      key={idx}
                      className={`px-2 py-0.5 rounded-lg text-sm font-bold ${
                        wr.matched
                          ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                          : "bg-rose-500/25 text-rose-300 border-b-2 border-rose-500"
                      }`}
                    >
                      {wr.word}
                    </span>
                  ))}
                </div>

                <p className="text-xs text-slate-200 leading-relaxed">
                  {arenaResult.feedbackVi}
                </p>

                {/* Shadowing Retry + Next Question Buttons */}
                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button
                    onClick={onShadowRetry}
                    className={`py-2.5 px-3 rounded-xl font-extrabold text-xs flex items-center justify-center gap-1 ${
                      shadowingCompleted
                        ? "bg-emerald-900/60 text-emerald-300 border border-emerald-500/40"
                        : "bg-purple-600 hover:bg-purple-500 text-white shadow"
                    }`}
                  >
                    <span>{shadowingCompleted ? "✅ Đã sửa Shadowing" : "🎙️ Nói lại Shadowing"}</span>
                  </button>

                  <button
                    onClick={onNext}
                    className="py-2.5 px-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-xs flex items-center justify-center gap-1 shadow"
                  >
                    <span>Câu tiếp theo ➔</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
